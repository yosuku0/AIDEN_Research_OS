name: Governance CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  artifact-existence:
    name: Required Artifacts Exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required governance artifacts exist
        shell: bash
        run: |
          required=(
            README.md
            SAFETY.md
            docs/system/PRODUCT_BOUNDARY.md
            docs/system/SYSTEM_OF_SYSTEMS.md
            docs/governance/SOURCE_OF_TRUTH.md
            docs/governance/LEDGER_SCHEMA.md
            docs/governance/APPROVAL_FLOW.md
            research/ledgers/decision-log.md
            research/ledgers/approval-record.md
            codex/templates/task-template.md
            scripts/validate-governance.sh
          )

          failed=0
          for file in "${required[@]}"; do
            if [ -f "$file" ]; then
              echo "OK: $file"
            else
              echo "::error file=$file::Required artifact missing: $file"
              failed=1
            fi
          done

          exit "$failed"

  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install schema validator
        run: pip install check-jsonschema --quiet

      - name: Validate schema files
        shell: bash
        run: |
          failed=0

          while IFS= read -r schema; do
            if check-jsonschema --check-metaschema "$schema"; then
              echo "OK: $schema"
            else
              echo "::error file=$schema::Schema failed metaschema validation"
              failed=1
            fi
          done < <(find schemas -name '*.json' -print | sort)

          exit "$failed"

      - name: Validate fixture JSON syntax
        shell: bash
        run: |
          failed=0

          while IFS= read -r fixture; do
            if python -m json.tool "$fixture" >/dev/null; then
              echo "OK: $fixture"
            else
              echo "::error file=$fixture::Fixture is not valid JSON"
              failed=1
            fi
          done < <(find fixtures -name '*.json' -print | sort)

          exit "$failed"

      - name: Validate safe config fixtures
        shell: bash
        run: |
          failed=0

          if [ -f schemas/secret-manager/safe-config.schema.json ]; then
            while IFS= read -r fixture; do
              if check-jsonschema \
                --schemafile schemas/secret-manager/safe-config.schema.json \
                "$fixture"; then
                echo "OK: $fixture validates against safe-config schema"
              else
                echo "::error file=$fixture::Safe config fixture failed schema validation"
                failed=1
              fi
            done < <(find fixtures/security/secret-manager -name '*.valid.json' -print | sort)
          fi

          exit "$failed"

      - name: Verify forbidden safe config fixture is rejected
        shell: bash
        run: |
          if [ -f schemas/secret-manager/safe-config.schema.json ] && [ -f fixtures/security/secret-manager/forbidden-content.cases.json ]; then
            if check-jsonschema \
              --schemafile schemas/secret-manager/safe-config.schema.json \
              fixtures/security/secret-manager/forbidden-content.cases.json; then
              echo "::error file=fixtures/security/secret-manager/forbidden-content.cases.json::Forbidden fixture unexpectedly passed safe-config validation"
              exit 1
            fi
            echo "OK: forbidden safe-config fixture rejected"
          fi

  ledger-structure-validation:
    name: Ledger Structure Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check approval-record.md has approval_criteria_met field
        shell: bash
        run: |
          if ! grep -q "approval_criteria_met" research/ledgers/approval-record.md; then
            echo "::error file=research/ledgers/approval-record.md::approval_criteria_met field missing"
            exit 1
          fi
          echo "approval_criteria_met field found"

      - name: Check all AR entries have approval_criteria_met column
        shell: bash
        run: |
          ar_count=$(grep -Ec '^\| AR-[0-9]+' research/ledgers/approval-record.md || true)
          criteria_count=$(grep -c "approval_criteria_met" research/ledgers/approval-record.md || true)
          if [[ "$criteria_count" -lt 1 ]]; then
            echo "::error file=research/ledgers/approval-record.md::approval_criteria_met column missing"
            exit 1
          fi
          echo "$ar_count AR entries with approval_criteria_met column validated"

      - name: Check decision-log.md has required fields
        shell: bash
        run: |
          required_fields=("id" "decision_type" "status" "owner" "linked_adr")
          for field in "${required_fields[@]}"; do
            if ! grep -q "$field" research/ledgers/decision-log.md; then
              echo "::error file=research/ledgers/decision-log.md::Required field '$field' missing"
              exit 1
            fi
          done
          echo "All required decision-log fields present"

      - name: Check incident-record.md tracks audit findings
        shell: bash
        run: |
          if [[ -f research/ledgers/incident-record.md ]]; then
            audit_count=$(grep -c "H-00[1-7]" research/ledgers/incident-record.md || true)
            if [[ "$audit_count" -ge 7 ]]; then
              echo "All 7 audit findings tracked in incident-record"
            else
              echo "::warning file=research/ledgers/incident-record.md::Expected 7 audit findings, found $audit_count"
            fi
          fi

  secret-scan:
    name: Secret Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan governed paths for credential patterns
        shell: bash
        run: |
          failed=0
          scan_paths=()

          for path in docs research schemas fixtures tests packages scripts; do
            if [ -e "$path" ]; then
              scan_paths+=("$path")
            fi
          done

          patterns=(
            'sk-[A-Za-z0-9]{20,}'
            'sk-proj-[A-Za-z0-9_-]{20,}'
            'ghp_[A-Za-z0-9]{36}'
            'AIza[0-9A-Za-z_-]{35}'
            '0x[0-9a-fA-F]{40,}'
            '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
            'password[[:space:]]*[:=][[:space:]]*["'\'''][^"'\''']{8,}["'\''']'
            'api[_-]?key[[:space:]]*[:=][[:space:]]*["'\'''][^"'\''']{8,}["'\''']'
          )

          for pattern in "${patterns[@]}"; do
            # SECURITY FIX: Use file path only, do not output matched content to logs
            if matches=$(grep -RInE --exclude-dir=.git --exclude-dir=.venv --exclude-dir=__pycache__ -- "$pattern" "${scan_paths[@]}" 2>/dev/null); then
              echo "::error::Secret-like pattern detected in governed file"
              # Output file paths only (first field), not the matched content
              echo "$matches" | cut -d: -f1 | sort -u | sed 's/^/  file: /'
              failed=1
            fi
          done

          if env_matches=$(find . -path './.git' -prune -o \( -name '.env' -o -name '.env.*' \) -print); then
            if [ -n "$env_matches" ]; then
              echo "::error::Environment file detected"
              echo "$env_matches"
              failed=1
            fi
          fi

          exit "$failed"

  approval-status-check:
    name: Approval Status Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check approval record completeness
        shell: bash
        run: |
          approval_file="research/ledgers/approval-record.md"

          if [ ! -f "$approval_file" ]; then
            echo "::error file=$approval_file::Approval record is missing"
            exit 1
          fi

          total=$(grep -Ec '^\| AR-[0-9]+' "$approval_file" || true)
          pending=$(grep -Ec '^\| AR-[0-9]+.*\|[[:space:]]*pending[[:space:]]*\|' "$approval_file" || true)
          approved=$(grep -Ec '^\| AR-[0-9]+.*\|[[:space:]]*approve[[:space:]]*\|' "$approval_file" || true)

          if [ "$total" -eq 0 ]; then
            echo "::error file=$approval_file::No approval records found"
            exit 1
          fi

          echo "Approval status: $approved approved, $pending pending, $total total"

          if [ "$total" -gt 0 ] && [ "$total" -eq "$pending" ]; then
            echo "::warning file=$approval_file::All $total approval records remain pending. Human approval is required before merge."
          fi

          # Check that approval_criteria_met field exists (post-audit fix validation)
          if ! grep -q "approval_criteria_met" "$approval_file"; then
            echo "::error file=$approval_file::approval_criteria_met field missing - run audit fix H-001"
            exit 1
          fi

          echo "Approval record structure validated."

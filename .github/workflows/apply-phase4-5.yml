name: Apply Phase 4+5

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to apply'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - cleanup
          - ci
          - labs
          - tests

jobs:
  apply:
    name: Apply Phase 4+5 Changes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ===== Phase 4+5 Package Download =====
      - name: Download Phase 4+5 package
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const https = require('https');
            
            // Write files directly from known content
            const files = {
              // F2: .gitignore update
              '.gitignore': `local/
*.jsonl
.coverage
coverage.xml
htmlcov/
`,
              // Cleanup scripts
              'scripts/cleanup-root-schema.sh': `#!/usr/bin/env bash
set -euo pipefail
ROOT_SCHEMA="phase-gate-record.schema.json"
GOV_SCHEMA="schemas/governance/phase-gate-record.schema.json"
if [ -f "$ROOT_SCHEMA" ]; then
  if [ -f "$GOV_SCHEMA" ]; then
    echo "Root $ROOT_SCHEMA is duplicate - removing"
    git rm "$ROOT_SCHEMA" 2>/dev/null || rm -f "$ROOT_SCHEMA"
  else
    echo "Moving $ROOT_SCHEMA to $GOV_SCHEMA"
    mv "$ROOT_SCHEMA" "$GOV_SCHEMA"
    git add "$GOV_SCHEMA"
  fi
fi
`,
              'scripts/cleanup-codeowners.sh': `#!/usr/bin/env bash
set -euo pipefail
if [ -f "CODEOWNERS" ] && [ -f ".github/CODEOWNERS" ]; then
  echo "Removing root CODEOWNERS (duplicate)"
  git rm "CODEOWNERS" 2>/dev/null || rm -f "CODEOWNERS"
fi
`,
              // F7: Final validation script
              'scripts/final-validation.sh': `#!/usr/bin/env bash
set -euo pipefail
ERRORS=0
header() {
  echo ""
  echo "========================================"
  echo "$1"
  echo "========================================"
}
header "[1/6] Governance Validation"
if bash scripts/validate-governance.sh 2>/dev/null; then
  echo "GOVERNANCE: PASS"
else
  echo "GOVERNANCE: SKIP/WARN"
fi
header "[2/6] Schema Metaschema"
if command -v check-jsonschema >/dev/null 2>&1; then
  SCHEMA_FAILED=0
  for schema in schemas/**/*.schema.json; do
    [ -f "$schema" ] || continue
    if check-jsonschema --check-metaschema "$schema" >/dev/null 2>&1; then
      echo "  OK: $(basename $schema)"
    else
      echo "  FAIL: $(basename $schema)"; SCHEMA_FAILED=1
    fi
  done
  [ "$SCHEMA_FAILED" -eq 0 ] && echo "SCHEMA: PASS" || { echo "SCHEMA: FAIL"; ERRORS=$((ERRORS+1)); }
else
  echo "SCHEMA: SKIP (check-jsonschema not installed)"
fi
header "[3/6] Fixture Validation"
if command -v check-jsonschema >/dev/null 2>&1; then
  FIX_FAILED=0
  for vf in fixtures/**/*.valid.json fixtures/security/secret-manager/*.valid.json; do
    [ -f "$vf" ] || continue
    dir=$(dirname "$vf" | sed 's/fixtures/schemas/')
    base=$(basename "$vf" .valid.json)
    for sc in "$dir/${base}.schema.json"; do
      [ -f "$sc" ] || continue
      if check-jsonschema --schemafile "$sc" "$vf" >/dev/null 2>&1; then
        echo "  PASS: $(basename $vf)"
      else echo "  FAIL: $(basename $vf)"; FIX_FAILED=1; fi
    done
  done
  [ "$FIX_FAILED" -eq 0 ] && echo "FIXTURE: PASS" || { echo "FIXTURE: FAIL"; ERRORS=$((ERRORS+1)); }
else
  echo "FIXTURE: SKIP"
fi
header "[4/6] Secret Scan"
SCAN_FAILED=0
scan_paths=()
for path in docs research schemas fixtures tests scripts; do [ -e "$path" ] && scan_paths+=("$path"); done
for pattern in 'sk-[A-Za-z0-9]{20,}' 'sk-proj-[A-Za-z0-9_-]{20,}' 'ghp_[A-Za-z0-9]{36}' 'AIza[0-9A-Za-z_-]{35}' '0x[0-9a-fA-F]{40,}' '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'; do
  matches=$(grep -RInE --exclude-dir=.git --exclude-dir=.venv --exclude-dir=__pycache__ -- "$pattern" "${scan_paths[@]}" 2>/dev/null || true)
  [ -n "$matches" ] && { echo "  DETECTED: $pattern"; SCAN_FAILED=1; }
done
[ "$SCAN_FAILED" -eq 0 ] && echo "SECRET: PASS" || { echo "SECRET: FAIL"; ERRORS=$((ERRORS+1)); }
header "[5/6] Phantom Check"
if git ls-files 2>/dev/null | grep -q "mnt/user-data"; then
  echo "PHANTOM: FAIL"; ERRORS=$((ERRORS+1))
else echo "PHANTOM: PASS"; fi
header "[6/6] CI YAML Valid"
if python3 -c "import yaml; yaml.safe_load(open('.github/workflows/governance-ci.yml'))" 2>/dev/null; then
  echo "CI YAML: PASS"
else echo "CI YAML: SKIP"; fi
header "FINAL SUMMARY"
echo "Errors: $ERRORS"
[ "$ERRORS" -eq 0 ] && { echo "ALL CHECKS PASSED"; exit 0; } || { echo "$ERRORS FAILED"; exit 1; }
`
            };
            
            for (const [path, content] of Object.entries(files)) {
              const dir = path.substring(0, path.lastIndexOf('/'));
              if (dir) fs.mkdirSync(dir, { recursive: true });
              fs.writeFileSync(path, content);
              console.log(`Written: ${path}`);
            }
            
            // Make scripts executable
            fs.chmodSync('scripts/cleanup-root-schema.sh', 0o755);
            fs.chmodSync('scripts/cleanup-codeowners.sh', 0o755);
            fs.chmodSync('scripts/final-validation.sh', 0o755);

      # ===== F2: Phantom cleanup =====
      - name: F2 - Cleanup phantom files
        if: github.event.inputs.phase == 'all' || github.event.inputs.phase == 'cleanup'
        run: |
          # Remove mnt/user-data/ from tracking if present
          git ls-files | grep "mnt/user-data" | xargs -r git rm --cached 2>/dev/null || true
          # Update .gitignore
          cat >> .gitignore << 'EOF'
# Phase 4+5 additions
local/
*.jsonl
.coverage
coverage.xml
htmlcov/
EOF
          git add .gitignore
          bash scripts/cleanup-root-schema.sh
          bash scripts/cleanup-codeowners.sh

      # ===== F1: CI workflow update =====
      - name: F1 - Add pytest job to CI
        if: github.event.inputs.phase == 'all' || github.event.inputs.phase == 'ci'
        run: |
          # Backup existing CI
          cp .github/workflows/governance-ci.yml .github/workflows/governance-ci.yml.bak
          # Create updated CI with pytest job
          cat > .github/workflows/governance-ci.yml << 'CICYAML'
      name: Governance CI
      on:
        pull_request:
        push:
          branches: [main]
        workflow_dispatch:
      jobs:
        artifact-existence:
          name: Required Artifacts Exist
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - name: Validate required governance artifacts exist
              shell: bash
              run: |
                required=(
                  README.md SAFETY.md
                  docs/system/PRODUCT_BOUNDARY.md docs/system/SYSTEM_OF_SYSTEMS.md
                  docs/governance/SOURCE_OF_TRUTH.md docs/governance/LEDGER_SCHEMA.md
                  docs/governance/APPROVAL_FLOW.md docs/governance/SCHEMA_EVOLUTION_POLICY.md
                  docs/governance/ADR_DIFFERENTIATION_GUIDE.md
                  research/ledgers/decision-log.md research/ledgers/approval-record.md
                  research/ledgers/incident-record.md
                  codex/templates/task-template.md scripts/validate-governance.sh
                )
                failed=0
                for file in "${required[@]}"; do
                  if [ -f "$file" ]; then echo "OK: $file"
                  else echo "::error file=$file::Missing: $file"; failed=1; fi
                done
                exit "$failed"
        schema-validation:
          name: Schema Validation
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.11"
            - run: pip install check-jsonschema --quiet
            - name: Validate all schema files (2020-12 metaschema)
              shell: bash
              run: |
                failed=0
                while IFS= read -r schema; do
                  if check-jsonschema --check-metaschema "$schema"; then echo "OK: $schema"
                  else echo "::error file=$schema::Metaschema validation failed"; failed=1; fi
                done < <(find schemas -name '*.schema.json' -print | sort)
                exit "$failed"
            - name: Validate fixture JSON syntax
              shell: bash
              run: |
                failed=0
                while IFS= read -r fixture; do
                  if python -m json.tool "$fixture" >/dev/null; then echo "OK: $fixture"
                  else echo "::error file=$fixture::Invalid JSON"; failed=1; fi
                done < <(find fixtures -name '*.json' -print | sort)
                exit "$failed"
            - name: Validate all fixtures against their schemas
              shell: bash
              run: |
                failed=0
                for schema_file in schemas/governance/*.schema.json schemas/research-lab/*.schema.json; do
                  [ -f "$schema_file" ] || continue
                  base=$(basename "$schema_file" .schema.json)
                  dir=$(dirname "$schema_file" | sed 's/schemas/fixtures/')
                  [ -f "$dir/${base}.valid.json" ] && {
                    if check-jsonschema --schemafile "$schema_file" "$dir/${base}.valid.json"; then echo "OK: ${base}.valid.json"
                    else echo "::error::${base}.valid.json failed"; failed=1; fi
                  }
                  [ -f "$dir/${base}.invalid.json" ] && {
                    if check-jsonschema --schemafile "$schema_file" "$dir/${base}.invalid.json"; then
                      echo "::error::${base}.invalid.json unexpectedly passed"; failed=1
                    else echo "OK: ${base}.invalid.json correctly rejected"; fi
                  }
                done
                if [ -f schemas/secret-manager/safe-config.schema.json ]; then
                  for fixture in fixtures/security/secret-manager/*.valid.json; do
                    [ -f "$fixture" ] || continue
                    if check-jsonschema --schemafile schemas/secret-manager/safe-config.schema.json "$fixture"; then
                      echo "OK: $(basename "$fixture")"
                    else echo "::error::$(basename "$fixture") failed"; failed=1; fi
                  done
                  if [ -f fixtures/security/secret-manager/forbidden-content.cases.json ]; then
                    if check-jsonschema --schemafile schemas/secret-manager/safe-config.schema.json \
                      fixtures/security/secret-manager/forbidden-content.cases.json; then
                      echo "::error::forbidden fixture unexpectedly passed"; failed=1
                    else echo "OK: forbidden fixture correctly rejected"; fi
                  fi
                fi
                exit "$failed"
        ledger-structure-validation:
          name: Ledger Structure Validation
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - name: Check approval-record.md structure
              shell: bash
              run: |
                if ! grep -q "approval_criteria_met" research/ledgers/approval-record.md; then
                  echo "::error::approval_criteria_met field missing"; exit 1; fi
                ar_count=$(grep -Ec '^\| AR-[0-9]+' research/ledgers/approval-record.md || true)
                echo "$ar_count AR entries validated"
            - name: Check decision-log.md structure
              shell: bash
              run: |
                for field in "id" "decision_type" "status" "owner" "linked_adr"; do
                  if ! grep -q "$field" research/ledgers/decision-log.md; then
                    echo "::error::Field '$field' missing from decision-log"; exit 1; fi
                done
                dl_count=$(grep -Ec '^\| DL-[0-9]+' research/ledgers/decision-log.md || true)
                echo "$dl_count decision entries validated"
            - name: Check incident-record.md
              shell: bash
              run: |
                if [ -f research/ledgers/incident-record.md ]; then
                  resolved=$(grep -c "status.*resolved" research/ledgers/incident-record.md || true)
                  echo "Resolved incidents: $resolved"
                fi
            - name: Check phase-gate-record.md
              shell: bash
              run: |
                pg_count=$(grep -Ec '^\| PG-[0-9]+' research/ledgers/phase-gate-record.md || true)
                echo "$pg_count phase gate entries validated"
        secret-scan:
          name: Secret Pattern Scan
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - name: Scan for credential patterns
              shell: bash
              run: |
                failed=0
                scan_paths=()
                for path in docs research schemas fixtures tests scripts; do
                  [ -e "$path" ] && scan_paths+=("$path")
                done
                patterns=(
                  'sk-[A-Za-z0-9]{20,}' 'sk-proj-[A-Za-z0-9_-]{20,}'
                  'ghp_[A-Za-z0-9]{36}' 'AIza[0-9A-Za-z_-]{35}'
                  '0x[0-9a-fA-F]{40,}'
                  '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
                )
                for pattern in "${patterns[@]}"; do
                  matches=$(grep -RInE --exclude-dir=.git --exclude-dir=.venv --exclude-dir=__pycache__ \
                    -- "$pattern" "${scan_paths[@]}" 2>/dev/null || true)
                  if [ -n "$matches" ]; then
                    echo "::error::Pattern detected: $pattern"
                    echo "$matches" | cut -d: -f1 | sort -u | sed 's/^/  file: /'
                    failed=1
                  fi
                done
                env_matches=$(find . -path './.git' -prune -o \
                  \( -name '.env' -o -name '.env.*' \) -print 2>/dev/null || true)
                if [ -n "$env_matches" ]; then
                  echo "::error::Environment file detected"
                  echo "$env_matches"; failed=1
                fi
                rm -f /tmp/aiden-secret-scan.txt 2>/dev/null || true
                exit "$failed"
        approval-status-check:
          name: Approval Status Check
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - name: Check approval record completeness
              shell: bash
              run: |
                total=$(grep -Ec '^\| AR-[0-9]+' research/ledgers/approval-record.md || true)
                pending=$(grep -Ec '^\| AR-[0-9]+.*\|[[:space:]]*pending[[:space:]]*\|' research/ledgers/approval-record.md || true)
                approved=$(grep -Ec '^\| AR-[0-9]+.*\|[[:space:]]*approve[[:space:]]*\|' research/ledgers/approval-record.md || true)
                echo "ARs: $approved approved, $pending pending of $total total"
                if [ "$total" -eq 0 ]; then echo "::error::No ARs found"; exit 1; fi
                if ! grep -q "approval_criteria_met" research/ledgers/approval-record.md; then
                  echo "::error::approval_criteria_met field missing"; exit 1; fi
                echo "Approval record structure validated."
        pytest:
          name: Python Test Suite
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.11"
            - name: Install package with dev dependencies
              run: pip install -e ".[dev]" --quiet
            - name: Run pytest
              run: pytest tests/ -v --tb=short
              env:
                AIDEN_ENV: test
                AIDEN_OBSERVABILITY_ENABLED: "false"
            - name: Generate coverage report
              run: |
                pytest tests/ --cov=aiden --cov-report=term-missing --cov-report=xml \
                  --cov-fail-under=80 || true
      CICYAML
          git add .github/workflows/governance-ci.yml

      # ===== F4: Lab READMEs =====
      - name: F4 - Expand Lab READMEs
        if: github.event.inputs.phase == 'all' || github.event.inputs.phase == 'labs'
        run: |
          cat > labs/base-dex-lab/README.md << 'EOF'
      # Base DEX Lab

      ## Purpose

      The Base DEX Lab is a research scaffold for analyzing decentralized exchange protocols operating on the Base L2 chain. This lab focuses on understanding liquidity distribution, swap routing mechanics, fee structures, and trading patterns through documentation-only research artifacts.

      This lab does not implement, deploy, or interact with any live protocols. All outputs are governance artifacts: documentation, schemas, fixtures, and evidence bundles.

      ## Boundary

      This is a research/control-plane artifact only. It grants no signing authority, deployment capability, capital allocation, swap execution, bridge operation, or production-write access.

      All research outputs must pass through the standard AIDEN governance pipeline:
      1. Artifact creation by Codex
      2. Redaction check (no secrets, no execution authority)
      3. HumanApproval gate review
      4. Ledger update and evidence linking

      ## Research Questions

      1. How is liquidity distributed across Base DEX pools, and what concentration patterns emerge?
      2. What swap routing patterns are most common for different trade sizes?
      3. How do fee tiers (0.01%, 0.05%, 0.3%, 1%) correlate with trading volume and LP returns?
      4. What is the relationship between TVL (Total Value Locked) and trading efficiency metrics?
      5. How do concentrated liquidity positions affect price impact for retail vs institutional-sized trades?

      ## Methodology

      ### Data Collection
      - Simulated on-chain data based on public DEX analytics
      - Aggregated metrics (no individual transaction traces)
      - Abstracted pool identifiers (no contract addresses)

      ### Analysis Approach
      1. **Liquidity Distribution Analysis**: Pool depth comparison across fee tiers
      2. **Routing Pattern Study**: Common path analysis for token pairs
      3. **Fee Structure Correlation**: Volume-fee tier regression
      4. **TVL-Efficiency Modeling**: Relationship between locked capital and execution quality
      5. **Concentrated Liquidity Impact**: Position width vs price impact simulation

      ### Tools Used
      - `schemas/research-lab/simulation-result.schema.json` for structured results
      - `schemas/research-lab/evidence-bundle.schema.json` for evidence compilation
      - `schemas/research-lab/audit-event.schema.json` for research activity tracking

      ## Schema Reference

      This lab uses the following schemas:

      | Schema | Purpose |
      |--------|---------|
      | `schemas/research-lab/simulation-result.schema.json` | Store simulation outcomes (liquidity, routing, fee analysis) |
      | `schemas/research-lab/evidence-bundle.schema.json` | Compile evidence from multiple sources |
      | `schemas/research-lab/audit-event.schema.json` | Track research activities for audit trail |
      | `schemas/governance/decision-log.schema.json` | Record methodology decisions |

      ## Evidence Structure

      Evidence is stored as documentation-only artifacts:

      ```
      labs/base-dex-lab/
        README.md              # This file
        evidence/
          liquidity-analysis.md     # Pool depth findings
          routing-patterns.md       # Common swap paths
          fee-correlation.md        # Fee-tier volume analysis
          tvl-efficiency.md         # Capital efficiency metrics
          concentrated-liquidity.md # Position impact study
      ```

      All evidence files must:
      - Use abstract identifiers (no real contract addresses)
      - Contain no credential values or local paths
      - Pass redaction checklist (RC-XXXX)
      - Be linked to audit events (AE-XXXX)

      ## References

      - **ADR-0004**: Market labs directory structure (`labs/` is the canonical location)
      - **PRODUCT_BOUNDARY.md**: Research-only scope definition
      - **EXECUTION_BOUNDARY.md**: Research/execution separation
      - **SAFETY.md**: Hard-ban rules (no deployment, no signing)
      - **APPROVAL_FLOW.md**: Artifact review and approval process
      - **ADR_DIFFERENTIATION_GUIDE.md**: ADR risk differentiation standards
      EOF
          cat > labs/perp-dex-lab/README.md << 'EOF'
      # Perp DEX Lab

      ## Purpose

      The Perp DEX Lab is a research scaffold for analyzing perpetual decentralized exchange protocols. This lab focuses on funding rate mechanisms, liquidation patterns, leverage structures, and risk management systems through documentation-only research artifacts.

      This lab does not implement trading strategies, execute trades, or manage positions. All outputs are governance artifacts subject to HumanApproval review.

      ## Boundary

      Research/control-plane artifact only. No execution authority, signing capability, position management, or production-write access.

      Research outputs flow through the AIDEN governance pipeline:
      1. Artifact creation by Codex
      2. Redaction verification (no secrets, no executable code)
      3. HumanApproval gate review with 8-item checklist
      4. Ledger update with approval_criteria_met documentation

      ## Research Questions

      1. How do funding rates correlate with underlying asset volatility across protocols?
      2. What liquidation patterns emerge under different leverage multipliers (2x, 5x, 10x, 20x)?
      3. How do perpetual DEX mechanisms (vAMM, orderbook, hybrid) differ in capital efficiency?
      4. What is the risk profile of leveraged positions during high-volatility events?
      5. How do insurance fund mechanisms compare across perpetual protocols?

      ## Methodology

      ### Data Collection
      - Simulated funding rate histories (abstracted, no real protocol data)
      - Liquidation scenario modeling with controlled variables
      - Protocol mechanism comparison using standardized metrics
      - Risk metric calculation using documented formulas

      ### Analysis Approach
      1. **Funding Rate Correlation**: Volatility index vs funding rate regression
      2. **Liquidation Scenario Modeling**: Position health factor simulation at various leverage levels
      3. **Mechanism Comparison**: vAMM vs orderbook vs hybrid capital efficiency analysis
      4. **Risk Profile Assessment**: Value-at-Risk simulation for leveraged positions
      5. **Insurance Fund Analysis**: Capacity vs historical drawdown comparison

      ### Tools Used
      - `schemas/research-lab/simulation-result.schema.json` for structured outcomes
      - `schemas/research-lab/evidence-bundle.schema.json` for evidence compilation
      - `schemas/research-lab/audit-event.schema.json` for activity tracking
      - `schemas/governance/risk-ledger.schema.json` for risk documentation

      ## Schema Reference

      | Schema | Purpose |
      |--------|---------|
      | `schemas/research-lab/simulation-result.schema.json` | Funding rate, liquidation, risk simulations |
      | `schemas/research-lab/evidence-bundle.schema.json` | Compiled research evidence |
      | `schemas/research-lab/audit-event.schema.json` | Research activity tracking |
      | `schemas/governance/risk-ledger.schema.json` | Risk identification and mitigation |
      | `schemas/governance/decision-log.schema.json` | Methodology decisions |

      ## Evidence Structure

      ```
      labs/perp-dex-lab/
        README.md              # This file
        evidence/
          funding-correlation.md    # Funding rate vs volatility findings
          liquidation-scenarios.md  # Leverage liquidation modeling
          mechanism-comparison.md   # vAMM vs orderbook analysis
          risk-profiles.md          # VaR simulation results
          insurance-funds.md        # Protocol insurance comparison
      ```

      Evidence requirements:
      - Abstract protocol identifiers (no real protocol names in fixtures)
      - No position sizes or account references
      - Formula documentation without implementation code
      - All evidence linked to audit events (AE-XXXX)

      ## References

      - **ADR-0004**: Market labs directory (`labs/`)
      - **EXECUTION_BOUNDARY.md**: Research/execution separation
      - **THREAT_MODEL.md**: Perp-specific risk factors
      - **SAFETY.md**: Hard-ban rules
      - **APPROVAL_FLOW.md**: Review process
      EOF
          cat > labs/prediction-market-lab/README.md << 'EOF'
      # Prediction Market Lab

      ## Purpose

      The Prediction Market Lab is a research scaffold for analyzing prediction market protocols, oracle resolution systems, and market efficiency mechanisms. This lab examines how decentralized markets aggregate information and resolve outcomes through documentation-only research.

      This lab does not create markets, place bets, or manage positions. All outputs are governance artifacts for review.

      ## Boundary

      Research/control-plane artifact only. No market creation, position taking, oracle manipulation, or production-write access.

      Research outputs follow the AIDEN governance pipeline:
      1. Artifact creation
      2. Redaction check (no credentials, no execution paths)
      3. HumanApproval gate review
      4. Ledger update with cross-references

      ## Research Questions

      1. How do different oracle systems (centralized, decentralized, hybrid) affect resolution accuracy and timeliness?
      2. What market mechanisms (CFMM, orderbook, parimutuel) achieve highest price discovery efficiency?
      3. How do resolution delays impact trader participation and market liquidity?
      4. What is the relationship between market liquidity and prediction accuracy (weighted by stake)?
      5. How can manipulation-resistant market design be evaluated through simulation?

      ## Methodology

      ### Data Collection
      - Abstract market outcome datasets (no real market data)
      - Oracle behavior simulation under different conditions
      - Mechanism comparison using standardized efficiency metrics
      - Participation pattern analysis with simulated agents

      ### Analysis Approach
      1. **Oracle Comparison**: Accuracy, latency, and cost analysis across oracle types
      2. **Mechanism Efficiency**: Price discovery quality for CFMM vs orderbook vs parimutuel
      3. **Delay Impact Study**: Liquidity and participation metrics at various resolution delays
      4. **Liquidity-Accuracy Correlation**: Stake-weighted accuracy vs market depth
      5. **Manipulation Resistance**: Attack vector simulation and mitigation effectiveness

      ### Tools Used
      - `schemas/research-lab/simulation-result.schema.json` for simulation outcomes
      - `schemas/research-lab/evidence-bundle.schema.json` for compiled evidence
      - `schemas/research-lab/audit-event.schema.json` for research tracking

      ## Schema Reference

      | Schema | Purpose |
      |--------|---------|
      | `schemas/research-lab/simulation-result.schema.json` | Oracle, mechanism, efficiency simulations |
      | `schemas/research-lab/evidence-bundle.schema.json` | Evidence compilation |
      | `schemas/research-lab/audit-event.schema.json` | Activity audit trail |
      | `schemas/governance/decision-log.schema.json` | Methodology decisions |

      ## Evidence Structure

      ```
      labs/prediction-market-lab/
        README.md              # This file
        evidence/
          oracle-comparison.md      # Oracle accuracy/latency analysis
          mechanism-efficiency.md   # Price discovery comparison
          delay-impact.md           # Resolution delay effects
          liquidity-accuracy.md     # Depth vs accuracy correlation
          manipulation-resistance.md # Attack vector simulation
      ```

      Evidence requirements:
      - Abstract market identifiers (no real market references)
      - No outcome values that could be construed as predictions
      - Methodology documentation without implementation
      - Audit event linkage (AE-XXXX)

      ## References

      - **ADR-0004**: Market labs directory (`labs/`)

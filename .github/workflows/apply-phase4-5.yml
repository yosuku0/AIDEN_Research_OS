name: Apply Phase 4+5

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to apply'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - cleanup
          - ci
          - labs
          - tests

jobs:
  apply:
    name: Apply Phase 4+5 Changes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create cleanup scripts
        if: github.event.inputs.phase == 'all' || github.event.inputs.phase == 'cleanup'
        run: |
          mkdir -p scripts
          cat > scripts/cleanup-root-schema.sh << 'SCRIPT1'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT_SCHEMA="phase-gate-record.schema.json"
          GOV_SCHEMA="schemas/governance/phase-gate-record.schema.json"
          if [ -f "$ROOT_SCHEMA" ]; then
            if [ -f "$GOV_SCHEMA" ]; then
              echo "Root $ROOT_SCHEMA is duplicate - removing"
              git rm "$ROOT_SCHEMA" 2>/dev/null || rm -f "$ROOT_SCHEMA"
            else
              echo "Moving $ROOT_SCHEMA to $GOV_SCHEMA"
              mv "$ROOT_SCHEMA" "$GOV_SCHEMA"
              git add "$GOV_SCHEMA"
            fi
          else
            echo "No root-level schema to clean up"
          fi
          SCRIPT1
          chmod +x scripts/cleanup-root-schema.sh
          cat > scripts/cleanup-codeowners.sh << 'SCRIPT2'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ -f "CODEOWNERS" ] && [ -f ".github/CODEOWNERS" ]; then
            echo "Removing root CODEOWNERS (duplicate of .github/CODEOWNERS)"
            git rm "CODEOWNERS" 2>/dev/null || rm -f "CODEOWNERS"
          else
            echo "No duplicate CODEOWNERS found"
          fi
          SCRIPT2
          chmod +x scripts/cleanup-codeowners.sh

      - name: F2 - Cleanup phantom files and root artifacts
        if: github.event.inputs.phase == 'all' || github.event.inputs.phase == 'cleanup'
        run: |
          # Remove mnt/user-data/ from tracking
          git ls-files | grep "mnt/user-data" | xargs -r git rm --cached 2>/dev/null || true
          # Update .gitignore
          for pattern in local/ '*.jsonl' .coverage coverage.xml htmlcov/ mnt/user-data/; do
            if ! grep -qxF "$pattern" .gitignore 2>/dev/null; then
              echo "$pattern" >> .gitignore
            fi
          done
          git add .gitignore 2>/dev/null || true
          bash scripts/cleanup-root-schema.sh
          bash scripts/cleanup-codeowners.sh

      - name: F1 - Update CI workflow with pytest job
        if: github.event.inputs.phase == 'all' || github.event.inputs.phase == 'ci'
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/governance-ci.yml << 'CIYAML'
name: Governance CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  artifact-existence:
    name: Required Artifacts Exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required governance artifacts exist
        shell: bash
        run: |
          failed=0
          for file in README.md SAFETY.md docs/system/PRODUCT_BOUNDARY.md docs/system/SYSTEM_OF_SYSTEMS.md docs/governance/SOURCE_OF_TRUTH.md docs/governance/LEDGER_SCHEMA.md docs/governance/APPROVAL_FLOW.md docs/governance/SCHEMA_EVOLUTION_POLICY.md docs/governance/ADR_DIFFERENTIATION_GUIDE.md research/ledgers/decision-log.md research/ledgers/approval-record.md research/ledgers/incident-record.md codex/templates/task-template.md scripts/validate-governance.sh; do
            if [ -f "$file" ]; then echo "OK: $file"; else echo "::error file=$file::Missing: $file"; failed=1; fi
          done
          exit "$failed"

  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install check-jsonschema --quiet
      - name: Validate all schema files
        shell: bash
        run: |
          failed=0
          while IFS= read -r schema; do
            [ -f "$schema" ] || continue
            if check-jsonschema --check-metaschema "$schema"; then echo "OK: $(basename "$schema")"
            else echo "::error file=$schema::Metaschema validation failed"; failed=1; fi
          done < <(find schemas -name '*.schema.json' -print | sort)
          exit "$failed"
      - name: Validate fixture JSON syntax
        shell: bash
        run: |
          failed=0
          while IFS= read -r fixture; do
            [ -f "$fixture" ] || continue
            if python -m json.tool "$fixture" >/dev/null; then echo "OK: $(basename "$fixture")"
            else echo "::error file=$fixture::Invalid JSON"; failed=1; fi
          done < <(find fixtures -name '*.json' -print | sort)
          exit "$failed"
      - name: Validate fixtures against schemas
        shell: bash
        run: |
          failed=0
          for schema_file in schemas/governance/*.schema.json schemas/research-lab/*.schema.json; do
            [ -f "$schema_file" ] || continue
            base=$(basename "$schema_file" .schema.json)
            dir=$(dirname "$schema_file" | sed 's/schemas/fixtures/')
            if [ -f "$dir/${base}.valid.json" ]; then
              if check-jsonschema --schemafile "$schema_file" "$dir/${base}.valid.json"; then echo "PASS: ${base}.valid.json"
              else echo "::error::${base}.valid.json failed"; failed=1; fi
            fi
            if [ -f "$dir/${base}.invalid.json" ]; then
              if check-jsonschema --schemafile "$schema_file" "$dir/${base}.invalid.json"; then
                echo "::error::${base}.invalid.json unexpectedly passed"; failed=1
              else echo "PASS: ${base}.invalid.json correctly rejected"; fi
            fi
          done
          if [ -f schemas/secret-manager/safe-config.schema.json ]; then
            for fixture in fixtures/security/secret-manager/*.valid.json; do
              [ -f "$fixture" ] || continue
              if check-jsonschema --schemafile schemas/secret-manager/safe-config.schema.json "$fixture"; then echo "PASS: $(basename "$fixture")"
              else echo "::error::$(basename "$fixture") failed"; failed=1; fi
            done
            if [ -f fixtures/security/secret-manager/forbidden-content.cases.json ]; then
              if check-jsonschema --schemafile schemas/secret-manager/safe-config.schema.json fixtures/security/secret-manager/forbidden-content.cases.json; then
                echo "::error::forbidden fixture unexpectedly passed"; failed=1
              else echo "PASS: forbidden fixture correctly rejected"; fi
            fi
          fi
          exit "$failed"

  ledger-structure-validation:
    name: Ledger Structure Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check approval-record.md structure
        shell: bash
        run: |
          if ! grep -q "approval_criteria_met" research/ledgers/approval-record.md; then echo "::error::approval_criteria_met field missing"; exit 1; fi
          ar_count=$(grep -Ec '^\| AR-[0-9]+' research/ledgers/approval-record.md || true)
          echo "$ar_count AR entries validated"
      - name: Check decision-log.md structure
        shell: bash
        run: |
          for field in id decision_type status owner linked_adr; do
            if ! grep -q "$field" research/ledgers/decision-log.md; then echo "::error::Field '$field' missing from decision-log"; exit 1; fi
          done
          dl_count=$(grep -Ec '^\| DL-[0-9]+' research/ledgers/decision-log.md || true)
          echo "$dl_count decision entries validated"
      - name: Check incident-record.md
        shell: bash
        run: |
          if [ -f research/ledgers/incident-record.md ]; then
            resolved=$(grep -c "status.*resolved" research/ledgers/incident-record.md || true)
            echo "Resolved incidents: $resolved"
          fi
      - name: Check phase-gate-record.md
        shell: bash
        run: |
          pg_count=$(grep -Ec '^\| PG-[0-9]+' research/ledgers/phase-gate-record.md || true)
          echo "$pg_count phase gate entries validated"

  secret-scan:
    name: Secret Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for credential patterns
        shell: bash
        run: |
          failed=0
          scan_paths=()
          for path in docs research schemas fixtures tests scripts; do [ -e "$path" ] && scan_paths+=("$path"); done
          for pattern in 'sk-[A-Za-z0-9]{20,}' 'sk-proj-[A-Za-z0-9_-]{20,}' 'ghp_[A-Za-z0-9]{36}' 'AIza[0-9A-Za-z_-]{35}' '0x[0-9a-fA-F]{40,}' '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'; do
            matches=$(grep -RInE --exclude-dir=.git --exclude-dir=.venv --exclude-dir=__pycache__ -- "$pattern" "${scan_paths[@]}" 2>/dev/null || true)
            if [ -n "$matches" ]; then echo "::error::Pattern detected: $pattern"; echo "$matches" | cut -d: -f1 | sort -u | sed 's/^/  file: /'; failed=1; fi
          done
          env_matches=$(find . -path './.git' -prune -o \( -name '.env' -o -name '.env.*' \) -print 2>/dev/null || true)
          if [ -n "$env_matches" ]; then echo "::error::Environment file detected"; echo "$env_matches"; failed=1; fi
          rm -f /tmp/aiden-secret-scan.txt 2>/dev/null || true
          exit "$failed"

  approval-status-check:
    name: Approval Status Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check approval record completeness
        shell: bash
        run: |
          total=$(grep -Ec '^\| AR-[0-9]+' research/ledgers/approval-record.md || true)
          pending=$(grep -Ec '^\| AR-[0-9]+.*\|[[:space:]]*pending[[:space:]]*\|' research/ledgers/approval-record.md || true)
          approved=$(grep -Ec '^\| AR-[0-9]+.*\|[[:space:]]*approve[[:space:]]*\|' research/ledgers/approval-record.md || true)
          echo "ARs: $approved approved, $pending pending of $total total"
          if [ "$total" -eq 0 ]; then echo "::error::No ARs found"; exit 1; fi
          if ! grep -q "approval_criteria_met" research/ledgers/approval-record.md; then echo "::error::approval_criteria_met field missing"; exit 1; fi
          echo "Approval record structure validated."

  pytest:
    name: Python Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with dev dependencies
        run: pip install -e ".[dev]" --quiet
      - name: Run pytest
        run: pytest tests/ -v --tb=short
        env:
          AIDEN_ENV: test
          AIDEN_OBSERVABILITY_ENABLED: "false"
      - name: Generate coverage report
        run: |
          pytest tests/ --cov=aiden --cov-report=term-missing --cov-report=xml --cov-fail-under=80 || true
CIYAML
          git add .github/workflows/governance-ci.yml scripts/

